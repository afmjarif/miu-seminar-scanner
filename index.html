<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MIU CSE Club - QR Scanner</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none; 
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh; /* Modern full viewport height for Android */
      overflow: hidden; /* Prevents scrolling */
      font-family: 'Inter', Arial, sans-serif;
      background: #0A2540; /* Dark background to blend with camera */
      color: #111;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
    }

    /* ✅ Top Header & Buttons */
    .top-section {
      flex-shrink: 0;
      background: #F8FAFC;
      padding: 10px 10px 8px;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .mode-buttons.row2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .mode-buttons button {
      padding: 10px 2px;
      border: 2px solid #E2E8F0;
      background: white;
      color: #64748B;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.1s;
    }

    .mode-buttons button.active {
      background: #0A2540;
      border-color: #0A2540;
      color: white;
    }
    
    .mode-buttons button.active.info-btn {
      background: #00C2FF;
      border-color: #00C2FF;
      color: #0A2540;
    }

    /* ✅ Middle Camera Section */
    .camera-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    #reader {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Hide the default HTML5-Qrcode UI text/icons if possible */
    #reader__dashboard_section_csr {
      display: none !important;
    }

    /* ✅ Bottom Status & Controls */
    .bottom-section {
      flex-shrink: 0;
      background: #F8FAFC;
      padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .status {
      padding: 12px;
      border-radius: 12px;
      background: white;
      text-align: center;
      border: 2px solid #E2E8F0;
      margin-bottom: 10px;
      min-height: 90px; /* Prevents layout jumping */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status h2 { margin: 0 0 4px; font-size: 18px; font-weight: 900; letter-spacing: 0.5px;}
    .status p  { margin: 2px 0; font-size: 13px; line-height: 1.4; font-weight: 600; color: #333;}
    .status strong { font-size: 16px; color: #0A2540; display: block; margin-top: 2px;}

    .success { background: #ECFDF5; border-color: #10B981; }
    .success h2 { color: #065F46; }
    .success strong { color: #10B981; }

    .error   { background: #FEF2F2; border-color: #EF4444; }
    .error h2 { color: #991B1B; }

    .warning { background: #FFFBEB; border-color: #F59E0B; }
    .warning h2 { color: #92400E; }

    .info    { background: #EFF6FF; border-color: #3B82F6; }
    .info h2 { color: #1E40AF; }

    .start-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #0A2540;
      color: white;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(10,37,64,0.2);
      transition: 0.2s;
    }

    .start-button:disabled { 
      opacity: 0.5; 
      box-shadow: none; 
      background: #64748B;
    }
  </style>
</head>

<body>

<div class="app-container">

  <!-- TOP: Buttons -->
  <div class="top-section">
    <div class="mode-buttons">
      <button id="entryButton" class="active" onclick="setMode('ENTRY')">ENTRY</button>
      <button id="foodButton" onclick="setMode('FOOD')">FOOD</button>
      <button id="snacksButton" onclick="setMode('SNACKS')">SNACKS</button>
    </div>
    <div class="mode-buttons row2">
      <button id="giftButton" onclick="setMode('GIFT')">GIFT</button>
      <button id="infoButton" class="info-btn" onclick="setMode('INFO')">INFO</button>
    </div>
  </div>

  <!-- MIDDLE: Camera -->
  <div class="camera-section">
    <div id="reader"></div>
  </div>

  <!-- BOTTOM: Status & Start Button -->
  <div class="bottom-section">
    
    <div id="status" class="status info">
      <h2>READY</h2>
      <p>Select a mode and tap Start Camera.</p>
    </div>

    <button id="startButton" class="start-button" onclick="startScanner()">
      📷 START CAMERA
    </button>

  </div>

</div>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzY2-Vrn2tmgsLO8H1g6tOy7tTusEWT6ZyFcsWkf3C3Q2oVz1-RC-h_df0lTst9ph-aWA/exec";

let scanner = null;
let scannerRunning = false;
let currentMode = "ENTRY";
let processing = false;

// ✅ Force Screen to stay awake (if supported by browser)
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(err => console.log('Wake Lock failed'));
}

function setMode(mode) {
  currentMode = mode;
  var modes = ["ENTRY", "FOOD", "SNACKS", "GIFT", "INFO"];
  
  modes.forEach(function(m) {
    var btn = document.getElementById(m.toLowerCase() + "Button");
    if (btn) btn.classList.remove("active");
  });

  var active = document.getElementById(mode.toLowerCase() + "Button");
  if (active) active.classList.add("active");

  showStatus("info", mode + " MODE", "Ready to scan.");
}

function showStatus(type, title, message) {
  var status = document.getElementById("status");
  status.className = "status " + type;
  status.innerHTML = "<h2>" + escapeHtml(title) + "</h2><p>" + message + "</p>";
}

function startScanner() {
  if (scannerRunning) return;
  if (!scanner) scanner = new Html5Qrcode("reader");

  showStatus("info", "STARTING CAMERA", "Please allow camera access.");

  // Start camera full screen
  scanner.start(
    { facingMode: "environment" },
    { 
      fps: 15, 
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
        let qrboxSize = Math.floor(minEdge * 0.7); // Box takes 70% of the screen
        return { width: qrboxSize, height: qrboxSize };
      }
    },
    onScanSuccess,
    onScanFailure
  )
  .then(function() {
    scannerRunning = true;
    document.getElementById("startButton").disabled = true;
    document.getElementById("startButton").innerText = "🟢 CAMERA ACTIVE";
    showStatus("info", currentMode + " MODE", "Point the camera at a QR code.");
  })
  .catch(function(error) {
    console.error(error);
    showStatus("error", "CAMERA ERROR", "Camera could not be started. Please allow permission.");
    scannerRunning = false;
  });
}

function onScanSuccess(decodedText, decodedResult) {
  if (processing) return;
  processing = true;
  
  // Vibrate phone if supported (feels like a real scanner)
  if (navigator.vibrate) navigator.vibrate(100);

  if (scannerRunning) {
    try { scanner.pause(true); } catch (e) { console.log(e); }
  }
  showStatus("info", "VERIFYING...", "Checking database...");
  verifyToken(decodedText);
}

function onScanFailure(error) { }

function verifyToken(token) {
  const url = API_URL + "?token=" + encodeURIComponent(token) + "&action=" + encodeURIComponent(currentMode) + "&callback=handleResponse";
  const script = document.createElement("script");
  script.src = url;
  script.id  = "jsonpRequest";
  script.onerror = function() {
    showStatus("error", "CONNECTION ERROR", "Could not connect to the server.");
    finishProcessing();
  };
  document.body.appendChild(script);
}

function handleResponse(data) {
  /* SUCCESS */
  if (data.success && currentMode !== "INFO") {
    showStatus("success", data.message,
      "<strong>" + escapeHtml(data.name || "") + "</strong>" +
      "RegID: " + escapeHtml(data.regId || "") + "<br>" +
      "Time: "  + escapeHtml(data.time  || "")
    );
  }
  /* INFO */
  else if (data.success && currentMode === "INFO") {
    showStatus("info", "PARTICIPANT INFO",
      "<strong>" + escapeHtml(data.name || "") + "</strong><br>" +
      "RegID: " + escapeHtml(data.regId || "") + "<br>" +
      "ID: " + escapeHtml(data.studentId || "N/A") + "<br>" +
      "Dept: " + escapeHtml(data.department || "N/A") + "<br>" +
      "Batch: " + escapeHtml(data.batch || "N/A") + "<br>" +
      "Phone: " + escapeHtml(data.phone || "N/A")
    );
  }
  /* DUPLICATE */
  else if (data.duplicate) {
    showStatus("warning", data.message,
      "<strong>" + escapeHtml(data.name || "") + "</strong>" +
      "RegID: " + escapeHtml(data.regId || "") + "<br>" +
      "Prev Time: " + escapeHtml(data.time || "Not recorded")
    );
  }
  /* PAYMENT BLOCKED */
  else if (data.paymentBlocked) {
    showStatus("warning", "⚠️ PAYMENT NOT VERIFIED",
      "<strong>" + escapeHtml(data.name || "") + "</strong>" +
      "RegID: " + escapeHtml(data.regId || "") + "<br>" +
      "Status: " + escapeHtml(data.paymentStatus || "Pending") + "<br>" +
      "<small>Visit registration desk.</small>"
    );
  }
  /* INVALID */
  else {
    showStatus("error", "INVALID QR", escapeHtml(data.message || "QR code is not valid."));
  }

  finishProcessing();
}

function finishProcessing() {
  processing = false;
  const script = document.getElementById("jsonpRequest");
  if (script) script.remove();

  setTimeout(function() {
    if (scanner && scannerRunning) {
      try { scanner.resume(); } catch (error) { console.log(error); }
    }
  }, 2000); // 2 second cooldown before scanning next person
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = String(text);
  return div.innerHTML;
}

</script>

</body>
</html>
