<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MIU CSE Club - AI Summit Scanner</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none; 
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #060C14; 
      color: #ffffff;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
      background: radial-gradient(circle at top, #0A2540 0%, #060C14 100%);
      padding: 10px 15px;
      padding-top: calc(10px + env(safe-area-inset-top));
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    /* ✅ Top Control Bar (Bigger Text & Boxes) */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
      z-index: 10;
    }
    .mode-grid.row2 {
      grid-template-columns: repeat(2, 1fr);
      margin-bottom: 15px;
    }

    .mode-btn {
      padding: 16px 6px; /* Increased padding */
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 37, 64, 0.6);
      color: #94A3B8;
      font-size: 16px; /* Doubled text size */
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: rgba(0, 194, 255, 0.2);
      border-color: #00C2FF;
      color: #00C2FF;
      box-shadow: 0 0 20px rgba(0, 194, 255, 0.3);
    }
    .mode-btn .icon { font-size: 24px; } /* Bigger icon */

    /* ✅ Camera Section (Perfect Square) */
    .camera-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
    }

    .scanner-frame {
      width: 100%;
      max-width: 400px; /* Limits width on tablets */
      aspect-ratio: 1 / 1; /* Forces perfect square */
      border-radius: 20px;
      position: relative;
      background: #000;
      border: 3px solid #00C2FF;
      box-shadow: 0 0 30px rgba(0, 194, 255, 0.2);
      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    /* Hide default HTML5-QRCode UI */
    #reader__dashboard_section_csr { display: none !important; }

    /* ✅ Bottom Section */
    .bottom-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
    }

    .status-pill {
      padding: 10px 20px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #E2E8F0;
      font-size: 16px; /* Doubled */
      font-weight: 700;
      margin-bottom: 15px;
    }

    .btn-scan {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00C2FF 0%, #007BFF 100%);
      color: #000;
      font-size: 24px; /* Doubled */
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 194, 255, 0.4);
      transition: 0.2s;
      margin-bottom: 20px;
    }

    .btn-scan:active { transform: scale(0.96); }
    .btn-scan:disabled { background: #1E293B; color: #64748B; box-shadow: none; }

    /* ✅ Branding (Bigger) */
    .branding {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 15px;
      width: 100%;
      text-align: center;
    }
    .branding .presented { font-size: 12px; color: #94A3B8; letter-spacing: 3px; font-weight: 800; text-transform: uppercase;}
    .branding .title { font-size: 22px; color: #ffffff; font-weight: 900; margin: 4px 0; text-transform: uppercase; letter-spacing: 1px;}
    .branding .club { font-size: 14px; color: #00C2FF; font-weight: 800; letter-spacing: 2px;}

    /* ✅ Oversized Popup Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 12, 20, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0F172A;
      width: 100%;
      max-width: 600px;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 30px 20px calc(30px + env(safe-area-inset-bottom));
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      height: 80vh; /* Takes up 80% of screen */
      max-height: 80vh;
      overflow-y: auto;
      border-top: 2px solid #00C2FF;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .drag-handle {
      width: 60px;
      height: 6px;
      background: #334155;
      border-radius: 10px;
      margin: 0 auto 25px auto;
    }

    /* Modal Badges (Bigger) */
    .badge { 
      padding: 12px 35px; 
      border-radius: 50px; 
      font-weight: 900; 
      font-size: 20px; /* Doubled */
      display: inline-block; 
      margin-bottom: 25px; 
      letter-spacing: 3px; 
    }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: #10B981; border: 2px solid #10B981; }
    .badge-error { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 2px solid #EF4444; }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #F59E0B; border: 2px solid #F59E0B; }
    .badge-info { background: rgba(59, 130, 246, 0.2); color: #3B82F6; border: 2px solid #3B82F6; }

    .modal-card h1 { color: #ffffff; font-size: 32px; font-weight: 900; margin-bottom: 30px; line-height: 1.3; }

    /* Info Table (Doubled Text) */
    .info-table { width: 100%; text-align: left; border-collapse: collapse; margin-bottom: auto;}
    .info-table td { padding: 18px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 18px; } /* Doubled */
    .info-table td:first-child { color: #94A3B8; font-weight: 600; width: 45%; }
    .info-table td:last-child { color: #ffffff; font-weight: 900; text-align: right; font-size: 20px;} /* Doubled */

    .btn-close {
      width: 100%;
      padding: 22px;
      margin-top: 25px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00C2FF 0%, #007BFF 100%);
      color: #000;
      font-size: 22px; /* Doubled */
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app-container">

  <!-- ✅ Mode Grid (5 Boxes) -->
  <div class="mode-grid">
    <button id="btn-ENTRY" class="mode-btn active" onclick="setMode('ENTRY')">
      <span class="icon">🛡️</span> ENTRY
    </button>
    <button id="btn-FOOD" class="mode-btn" onclick="setMode('FOOD')">
      <span class="icon">🍽️</span> FOOD
    </button>
    <button id="btn-SNACKS" class="mode-btn" onclick="setMode('SNACKS')">
      <span class="icon">☕</span> SNACKS
    </button>
  </div>
  <div class="mode-grid row2">
    <button id="btn-GIFT" class="mode-btn" onclick="setMode('GIFT')">
      <span class="icon">🎁</span> GIFT
    </button>
    <button id="btn-INFO" class="mode-btn" onclick="setMode('INFO')">
      <span class="icon">ℹ️</span> INFO
    </button>
  </div>

  <!-- ✅ Perfect Square Camera -->
  <div class="camera-section">
    <div class="scanner-frame">
      <div id="reader"></div>
    </div>
  </div>

  <!-- ✅ Bottom Section -->
  <div class="bottom-section">
    <div class="status-pill" id="statusText">
      Select a mode and tap SCAN
    </div>

    <button id="startButton" class="btn-scan" onclick="startScanner()">
      SCAN
    </button>

    <!-- ✅ Premium Branding -->
    <div class="branding">
      <div class="presented">MIU CSE Club Presents</div>
      <div class="title">AI Summit 2026</div>
      <div class="club">MIU CSE</div>
    </div>
  </div>

</div>

<!-- ✅ Big Popup Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-card" id="modalContent">
    <div class="drag-handle"></div>
    <!-- Content injected via JS -->
  </div>
</div>


<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzY2-Vrn2tmgsLO8H1g6tOy7tTusEWT6ZyFcsWkf3C3Q2oVz1-RC-h_df0lTst9ph-aWA/exec";

let scanner = null;
let scannerRunning = false;
let currentMode = "ENTRY";
let processing = false;

function setMode(mode) {
  currentMode = mode;
  var modes = ["ENTRY", "FOOD", "SNACKS", "GIFT", "INFO"];
  modes.forEach(function(m) {
    var btn = document.getElementById("btn-" + m);
    if (btn) btn.classList.remove("active");
  });
  var activeBtn = document.getElementById("btn-" + mode);
  if (activeBtn) activeBtn.classList.add("active");
  updateStatus("Mode: " + mode);
}

function updateStatus(text) {
  document.getElementById("statusText").innerText = text;
}

function startScanner() {
  if (scannerRunning) return;
  if (!scanner) scanner = new Html5Qrcode("reader");

  document.getElementById("startButton").disabled = true;
  document.getElementById("startButton").innerText = "LOADING...";
  updateStatus("Starting camera...");

  scanner.start(
    { facingMode: "environment" },
    { 
      fps: 15, 
      qrbox: function(width, height) {
        // Massive square scan box inside the camera
        var minSize = Math.min(width, height);
        return { width: Math.floor(minSize * 0.85), height: Math.floor(minSize * 0.85) };
      }
    },
    onScanSuccess,
    onScanFailure
  )
  .then(function() {
    scannerRunning = true;
    document.getElementById("startButton").innerText = "ACTIVE";
    updateStatus("Camera active. Point at QR.");
  })
  .catch(function(error) {
    alert("Camera Error: Please allow camera permissions and refresh.");
    document.getElementById("startButton").disabled = false;
    document.getElementById("startButton").innerText = "SCAN";
    updateStatus("Camera failed to start.");
    scannerRunning = false;
  });
}

function onScanSuccess(decodedText) {
  if (processing) return;
  processing = true;
  if (navigator.vibrate) navigator.vibrate(100);
  if (scannerRunning) {
    try { scanner.pause(true); } catch (e) {}
  }
  updateStatus("Verifying...");
  verifyToken(decodedText);
}

function onScanFailure(error) { }

function verifyToken(token) {
  const url = API_URL + "?token=" + encodeURIComponent(token) + "&action=" + encodeURIComponent(currentMode) + "&callback=handleResponse";
  const script = document.createElement("script");
  script.src = url;
  script.id  = "jsonpRequest";
  script.onerror = function() {
    showModal("error", "CONNECTION ERROR", "Could not connect to the server.");
  };
  document.body.appendChild(script);
}

function showModal(type, title, contentHtml) {
  const modal = document.getElementById("resultModal");
  const content = document.getElementById("modalContent");
  
  let badgeClass = "badge-" + type;
  
  content.innerHTML = `
    <div class="drag-handle"></div>
    <div class="badge ${badgeClass}">${title}</div>
    ${contentHtml}
    <button class="btn-close" onclick="closeModal()">SCAN NEXT</button>
  `;
  
  modal.classList.add("active");
  updateStatus("Scan complete.");
}

function closeModal() {
  const modal = document.getElementById("resultModal");
  modal.classList.remove("active");
  setTimeout(() => {
    processing = false;
    if (scanner && scannerRunning) {
      try { scanner.resume(); } catch (error) {}
      updateStatus("Camera active. Point at QR.");
    }
  }, 300);
}

function handleResponse(data) {
  const script = document.getElementById("jsonpRequest");
  if (script) script.remove();

  if (data.success && currentMode !== "INFO") {
    showModal("success", "VERIFIED", `
      <h1>${data.name || "N/A"}</h1>
      <table class="info-table">
        <tr><td>Registration ID</td><td>${data.regId || "N/A"}</td></tr>
        <tr><td>Action</td><td>${data.action || currentMode}</td></tr>
        <tr><td>Time</td><td>${data.time || "N/A"}</td></tr>
      </table>
    `);
  }
  else if (data.success && currentMode === "INFO") {
    showModal("info", "INFO FOUND", `
      <h1>${data.name || "N/A"}</h1>
      <table class="info-table">
        <tr><td>Registration ID</td><td>${data.regId || "N/A"}</td></tr>
        <tr><td>Student ID</td><td>${data.studentId || "N/A"}</td></tr>
        <tr><td>Department</td><td>${data.department || "N/A"}</td></tr>
        <tr><td>Batch</td><td>${data.batch || "N/A"}</td></tr>
        <tr><td>Phone</td><td>${data.phone || "N/A"}</td></tr>
      </table>
    `);
  }
  else if (data.duplicate) {
    showModal("warning", "ALREADY DONE", `
      <h1>${data.name || "N/A"}</h1>
      <table class="info-table">
        <tr><td>Registration ID</td><td>${data.regId || "N/A"}</td></tr>
        <tr><td>Previous Time</td><td>${data.time || "N/A"}</td></tr>
      </table>
    `);
  }
  else if (data.paymentBlocked) {
    showModal("warning", "PAYMENT PENDING", `
      <h1>${data.name || "N/A"}</h1>
      <table class="info-table">
        <tr><td>Registration ID</td><td>${data.regId || "N/A"}</td></tr>
        <tr><td>Payment Status</td><td style="color:#EF4444">${data.paymentStatus || "Pending"}</td></tr>
      </table>
    `);
  }
  else {
    showModal("error", "INVALID QR", `
      <h1 style="color:#EF4444;">Verification Failed</h1>
      <p style="color:#94A3B8; margin-bottom:20px; font-size:18px;">${data.message || "QR code is not valid."}</p>
    `);
  }
}
</script>

</body>
</html>
