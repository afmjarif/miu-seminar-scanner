<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
MIU Seminar Management
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f5f5f5;

  color: #111;
}

/* =========================
HEADER
========================= */

.header {

  background: #000;

  color: #fff;

  padding: 28px 20px;

  text-align: center;
}

.header h1 {

  margin: 0;

  font-size: 28px;
}

.header p {

  margin: 8px 0 0;

  font-size: 14px;

  opacity: 0.8;
}

/* =========================
CONTAINER
========================= */

.container {

  width: 100%;

  max-width: 1100px;

  margin: auto;

  padding: 25px 18px;
}

/* =========================
STATUS
========================= */

.status {

  text-align: center;

  margin-bottom: 20px;

  font-size: 14px;

  color: #555;
}

/* =========================
STAT CARDS
========================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 15px;
}

.card {

  background: #fff;

  border:
    1px solid #ddd;

  border-radius: 12px;

  padding: 22px;

  text-align: center;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.05);
}

.card .icon {

  font-size: 28px;

  margin-bottom: 8px;
}

.card .number {

  font-size: 32px;

  font-weight: 700;
}

.card .label {

  font-size: 13px;

  color: #666;

  margin-top: 5px;
}

/* =========================
ATTENDANCE
========================= */

.attendance {

  margin-top: 20px;

  background: #fff;

  border:
    1px solid #ddd;

  border-radius: 12px;

  padding: 25px;
}

.attendance-header {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  margin-bottom: 12px;
}

.attendance-title {

  font-weight: 700;

  font-size: 17px;
}

.percentage {

  font-size: 22px;

  font-weight: 700;
}

.progress {

  width: 100%;

  height: 18px;

  background: #e5e5e5;

  border-radius: 20px;

  overflow: hidden;
}

.progress-bar {

  height: 100%;

  width: 0%;

  background: #111;

  transition:
    width 0.5s ease;
}

/* =========================
BUTTONS
========================= */

.actions {

  display: flex;

  justify-content: center;

  gap: 12px;

  margin-top: 25px;

  flex-wrap: wrap;
}

.btn {

  border: none;

  border-radius: 8px;

  padding:
    13px 22px;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;
}

.btn-primary {

  background: #000;

  color: #fff;
}

.btn-secondary {

  background: #fff;

  color: #111;

  border:
    1px solid #ccc;
}

.btn:hover {

  opacity: 0.8;
}

/* =========================
RECENT ACTIVITY
========================= */

.recent {

  margin-top: 25px;

  background: #fff;

  border:
    1px solid #ddd;

  border-radius: 12px;

  overflow: hidden;
}

.recent-header {

  padding: 18px 20px;

  border-bottom:
    1px solid #eee;

  font-weight: 700;
}

.activity {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  padding:
    15px 20px;

  border-bottom:
    1px solid #eee;

  gap: 15px;
}

.activity:last-child {

  border-bottom: none;
}

.activity-name {

  font-weight: 600;
}

.activity-reg {

  font-size: 12px;

  color: #777;

  margin-top: 3px;
}

.activity-right {

  text-align: right;
}

.entered {

  font-size: 12px;

  font-weight: 700;
}

.time {

  font-size: 11px;

  color: #777;

  margin-top: 3px;
}

/* =========================
FOOTER
========================= */

.footer {

  text-align: center;

  padding: 30px;

  font-size: 12px;

  color: #777;
}

/* =========================
MOBILE
========================= */

@media(max-width: 750px) {

  .stats {

    grid-template-columns:
      repeat(2, 1fr);
  }

  .card {

    padding: 18px 10px;
  }

  .card .number {

    font-size: 25px;
  }

}

@media(max-width: 450px) {

  .stats {

    grid-template-columns:
      repeat(2, 1fr);

    gap: 10px;
  }

  .header h1 {

    font-size: 22px;
  }

  .activity {

    padding: 13px;
  }

}

</style>

</head>


<body>


<!-- =========================
HEADER
========================= -->

<header class="header">

  <h1>
    MIU CSE CLUB
  </h1>

  <p>
    Beyond the Classroom: AI, Careers & Digital Security
  </p>

</header>


<main class="container">


<!-- STATUS -->

<div
  id="status"
  class="status"
>
  Loading seminar data...
</div>


<!-- =========================
STATISTICS
========================= -->

<section class="stats">


  <div class="card">

    <div class="icon">
      👥
    </div>

    <div
      id="total"
      class="number"
    >
      -
    </div>

    <div class="label">
      Total Registered
    </div>

  </div>


  <div class="card">

    <div class="icon">
      ✅
    </div>

    <div
      id="attended"
      class="number"
    >
      -
    </div>

    <div class="label">
      Attended
    </div>

  </div>


  <div class="card">

    <div class="icon">
      ❌
    </div>

    <div
      id="absent"
      class="number"
    >
      -
    </div>

    <div class="label">
      Absent
    </div>

  </div>


  <div class="card">

    <div class="icon">
      🍱
    </div>

    <div
      id="food"
      class="number"
    >
      -
    </div>

    <div class="label">
      Food Given
    </div>

  </div>


</section>


<!-- =========================
FOOD PENDING
========================= -->

<section
  class="attendance"
>

  <div class="attendance-header">

    <div class="attendance-title">

      Attendance

    </div>

    <div
      id="percentage"
      class="percentage"
    >

      0%

    </div>

  </div>


  <div class="progress">

    <div
      id="progressBar"
      class="progress-bar"
    ></div>

  </div>


  <div
    style="
      margin-top:12px;
      color:#666;
      font-size:13px;
    "
  >

    Food Pending:

    <strong
      id="foodPending"
    >
      -
    </strong>

  </div>

</section>


<!-- =========================
ACTIONS
========================= -->

<div class="actions">

  <button
    class="btn btn-primary"
    onclick="openScanner()"
  >

    📷 Open QR Scanner

  </button>


  <button
    class="btn btn-secondary"
    onclick="loadDashboard()"
  >

    🔄 Refresh Data

  </button>

</div>


<!-- =========================
RECENT ACTIVITY
========================= -->

<section class="recent">

  <div class="recent-header">

    Recent Entry Activity

  </div>


  <div
    id="recent"
  >

    <div
      style="
        padding:20px;
        text-align:center;
        color:#777;
      "
    >

      Loading...

    </div>

  </div>

</section>


</main>


<footer class="footer">

  MIU CSE CLUB • ICT-Based Seminar 2026

</footer>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
  "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";


/* =====================================================
   OPEN SCANNER
===================================================== */

function openScanner() {

  window.location.href =
    "scanner.html";

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  const status =
    document.getElementById("status");

  status.textContent =
    "Updating data...";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=dashboard&t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "Server returned " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Unable to load dashboard."
      );

    }


    /* =========================
       STATISTICS
    ========================= */

    document.getElementById(
      "total"
    ).textContent =
      data.total;


    document.getElementById(
      "attended"
    ).textContent =
      data.attended;


    document.getElementById(
      "absent"
    ).textContent =
      data.absent;


    document.getElementById(
      "food"
    ).textContent =
      data.foodGiven;


    document.getElementById(
      "foodPending"
    ).textContent =
      data.foodPending;


    /* =========================
       ATTENDANCE
    ========================= */

    const percentage =
      Number(
        data.attendancePercentage || 0
      );


    document.getElementById(
      "percentage"
    ).textContent =
      percentage + "%";


    document.getElementById(
      "progressBar"
    ).style.width =
      Math.min(
        percentage,
        100
      ) + "%";


    /* =========================
       RECENT ACTIVITY
    ========================= */

    renderRecent(
      data.recent || []
    );


    status.textContent =
      "Last updated: " +
      new Date()
        .toLocaleTimeString();


  } catch (error) {

    console.error(error);

    status.textContent =
      "Unable to load data: " +
      error.message;

  }

}


/* =====================================================
   RECENT ACTIVITY
===================================================== */

function renderRecent(items) {

  const container =
    document.getElementById(
      "recent"
    );


  if (!items.length) {

    container.innerHTML =

      `<div
        style="
          padding:20px;
          text-align:center;
          color:#777;
        "
      >
        No entry recorded yet.
      </div>`;

    return;

  }


  container.innerHTML =
    items.map(function(item) {

      let time = "";

      if (item.entryTime) {

        time =
          new Date(
            item.entryTime
          ).toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      return `

        <div class="activity">

          <div>

            <div class="activity-name">

              ${escapeHtml(
                item.name
              )}

            </div>

            <div class="activity-reg">

              ${escapeHtml(
                item.regId
              )}

            </div>

          </div>


          <div class="activity-right">

            <div class="entered">

              ✓ ${escapeHtml(
                item.entry
              )}

            </div>

            <div class="time">

              ${time}

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

loadDashboard();


/* Auto refresh every 30 seconds */

setInterval(
  loadDashboard,
  30000
);

</script>


</body>

</html>
